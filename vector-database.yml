name: superbiz-milvus-2611

services:
  etcd:
    container_name: superbiz-milvus-2611-etcd
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - superbiz-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: superbiz-milvus-2611-minio
    # 复用本机已缓存的镜像；容器和数据卷仍与旧 Milvus 完全隔离。
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:19001:9001"
      - "127.0.0.1:19000:9000"
    volumes:
      - superbiz-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: superbiz-milvus-2611
    image: milvusdb/milvus:v2.6.11
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - superbiz-milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19531:19530"
      - "127.0.0.1:9092:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
  # 这是新增的 Attu 服务哦！
  attu:
    container_name: superbiz-milvus-2611-attu
    image: zilliz/attu:v2.6.5
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:3000"
    environment:
      # MILVUS_URL 指向 Docker 网络里的 Milvus standalone 服务
      MILVUS_URL: standalone:19530
    depends_on:
      standalone:
        condition: service_healthy
networks:
  default:
    name: superbiz-milvus-2611-network

volumes:
  superbiz-etcd-data:
    name: superbiz-milvus-2611-etcd-data
  superbiz-minio-data:
    name: superbiz-milvus-2611-minio-data
  superbiz-milvus-data:
    name: superbiz-milvus-2611-data
